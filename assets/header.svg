<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Hassan - full-stack, mobile, embedded, 3D" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.55" stop-color="#1a1244"/>
      <stop offset="1" stop-color="#2a1666"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9bfff"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c77dff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c77dff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c77dff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9d4edd" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9d4edd" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="dot" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="word">
      <text x="500" y="200" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="118" font-weight="800" letter-spacing="22">HASSAN</text>
    </clipPath>
  </defs>

  <rect width="1000" height="320" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="998" height="318" rx="21" fill="none" stroke="#3a2f7a" stroke-width="1.5"/>

  <!-- soft light behind the name, slowly breathing -->
  <ellipse cx="500" cy="165" rx="380" ry="95" fill="url(#halo)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- glow copy of the name -->
  <text x="500" y="200" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="118" font-weight="800" letter-spacing="22" fill="#c77dff" filter="url(#soft)" opacity="0.6">
    HASSAN
    <animate attributeName="opacity" values="0.35;0.75;0.35" dur="5s" repeatCount="indefinite"/>
  </text>

  <!-- the name -->
  <text x="500" y="200" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="118" font-weight="800" letter-spacing="22" fill="url(#ink)">HASSAN</text>

  <!-- light sweeping across the letters, then a pause -->
  <g clip-path="url(#word)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="-260 0; 1100 0; 1100 0" keyTimes="0; 0.4; 1" dur="7s" repeatCount="indefinite"/>
      <rect x="0" y="60" width="130" height="170" fill="url(#beam)" transform="skewX(-20)"/>
    </g>
  </g>

  <!-- rule with a light travelling along it -->
  <rect x="220" y="226" width="560" height="1.5" fill="url(#rule)"/>
  <circle cy="226.7" r="3.2" fill="#f3e8ff" filter="url(#dot)">
    <animate attributeName="cx" values="240;760;240" keyTimes="0;0.5;1" dur="6s" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" repeatCount="indefinite"/>
  </circle>
  <circle cy="226.7" r="1.6" fill="#ffffff">
    <animate attributeName="cx" values="240;760;240" keyTimes="0;0.5;1" dur="6s" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" repeatCount="indefinite"/>
  </circle>

  <!-- subtitle -->
  <text x="500" y="268" text-anchor="middle" font-family="'Fira Code','Consolas','Courier New',monospace" font-size="15" letter-spacing="7" fill="#b9a2e6">FULL-STACK  ·  MOBILE  ·  EMBEDDED  ·  3D</text>

  <text x="40" y="52" font-family="'Fira Code','Consolas','Courier New',monospace" font-size="11" letter-spacing="4" fill="#7e6cb8">DALIFE001</text>
  <text x="960" y="52" text-anchor="end" font-family="'Fira Code','Consolas','Courier New',monospace" font-size="11" letter-spacing="4" fill="#7e6cb8">FINLAND</text>
</svg>
